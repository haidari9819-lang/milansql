name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Tests (ctest)
        run: ctest --test-dir build --output-on-failure

  build-and-test-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (AddressSanitizer + UBSan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DASAN=ON

      - name: Build
        run: cmake --build build-asan

      - name: Run Tests (ctest, ASan/UBSan)
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1

  build-and-test-http-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build server binary
        run: cmake --build build --target milansql

      - name: Run HTTP API tests (Teststrategie Stufe 4 -- real HTTP requests, never port 8080)
        run: python3 scripts/http_api_test.py build/milansql

  build-and-test-windows:
    runs-on: windows-latest
    continue-on-error: true  # TODO: Windows-Build separat reparieren (Server laeuft auf Ubuntu)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Tests (ctest)
        run: ctest --test-dir build --output-on-failure
