version: '3.9'

services:
  milansql:
    image: milansql:12.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milansql
    restart: unless-stopped
    ports:
      - "${MILANSQL_PORT:-8080}:8080"
    volumes:
      - milansql-data:/var/lib/milansql
      - milansql-config:/etc/milansql
    environment:
      - DB_ROOT_PW=${DB_ROOT_PW:-changeme}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  milansql-data:
  milansql-config:
