apiVersion: v1
kind: Service
metadata:
  name: {{ include "milansql.fullname" . }}
  labels:
    {{- include "milansql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "milansql.selectorLabels" . | nindent 4 }}
