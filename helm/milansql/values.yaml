# MilanSQL Helm Chart — Default Values

replicaCount: 1

image:
  repository: milansql/milansql
  tag: "12.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: milansql.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

config:
  port: 8080
  rootPassword: ""   # auto-generated if empty

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Cloud features
cloud:
  enabled: true
  regions:
    - eu-central-1

# Security
security:
  ipAllowlist: []
  mtlsEnabled: false
